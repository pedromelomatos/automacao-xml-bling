x-automacao: &automacao
  build:
    context: .
    dockerfile: Dockerfile
  image: automacao-xml-bling:2.0-dropbox
  restart: unless-stopped
  env_file:
    - .env
  environment:
    TZ: America/Sao_Paulo
    AUTOMACAO_DATA_DIR: /dados
    BLING_TOKENS_FILE: /segredos/tokens.json
    AUTOMACAO_DROPBOX_CONFIG: /app/configuracao_dropbox.json
    RCLONE_CONFIG: /segredos/rclone/rclone.conf
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./dados:/dados
    - ./segredos:/segredos
    - ./configuracao.json:/app/configuracao.json:ro
    - ./configuracao_dropbox.json:/app/configuracao_dropbox.json:ro
  stop_grace_period: 150s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  redis:
    image: redis:7.4.12-alpine3.21
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-dados:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  automacao-xml-bling:
    <<: *automacao
    profiles: ["download"]
    command: ["python", "agendador_docker.py"]
    depends_on:
      redis:
        condition: service_healthy

  entregas-dropbox:
    <<: *automacao
    profiles: ["entrega"]
    command: ["python", "integracao_dropbox.py", "trabalhador"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-dados:
