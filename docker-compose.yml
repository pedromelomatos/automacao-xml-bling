services:
  automacao-xml-bling:
    build:
      context: .
      dockerfile: Dockerfile
    image: automacao-xml-bling:1.0
    container_name: automacao-xml-bling
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      AUTOMACAO_DATA_DIR: /dados
      BLING_TOKENS_FILE: /segredos/tokens.json
    volumes:
      - ./dados:/dados
      - ./segredos:/segredos
      - ./configuracao.json:/app/configuracao.json:ro
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
